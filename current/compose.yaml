# SYNTHETIC LOCAL DEMO ONLY - No real client data, not for internet deployment.
services:
  caseproof-demo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CASEPROOF_DEMO_MODE: "1"
      CASEPROOF_DATABASE_URL: "sqlite:////data/caseproof.sqlite3"
    volumes:
      - local_demo_db:/data
    command: ["sh", "-c", "python -m service.cli init-demo --database sqlite:////data/caseproof.sqlite3 && python -m uvicorn service.app:app --host 0.0.0.0 --port 8000 --workers 1"]
volumes:
  local_demo_db:
