name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CASEPROOF_DEMO_MODE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-2022
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install recorded development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Record environment
        run: |
          python -c "from pathlib import Path; Path('reports/ci').mkdir(parents=True, exist_ok=True)"
          python -VV > reports/ci/python.txt
          python -m pip freeze --all > reports/ci/installed.txt
      - name: Validate package contracts
        run: python -m scripts.check_package
      - name: Run unit and HTTP/SQLite regression tests
        run: python -m pytest -q --junitxml=reports/ci/pytest.xml
      - name: Run synthetic workflow smoke
        run: python -m scripts.smoke
      - name: Preserve this run's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-checks-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            reports/ci/
            reports/runs/
          if-no-files-found: warn
          retention-days: 14

  ui-syntax:
    name: Static UI JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m scripts.check_ui_syntax
      - run: node --check service/static/v1.js
      - run: node scripts/v1_ui_probe.js
      - run: node scripts/check_uncertain_recovery.cjs

  evaluation:
    name: Paired evaluation statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-evaluation.lock
      - run: python -m pytest -q tests/evaluation

  postgres:
    name: PostgreSQL 17 roles, RLS and concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: caseproof_ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CASEPROOF_PG_ADMIN_URL: postgresql+psycopg://postgres:caseproof_ephemeral_ci_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-postgres.lock
      - run: python -c "from pathlib import Path; Path('reports/ci').mkdir(parents=True, exist_ok=True)"
      - run: python -m pytest -q tests/postgres --junitxml=reports/ci/postgres.xml
      - name: Preserve PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgres-17-verification
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 14

  distribution:
    name: Build and install distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install recorded build tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build source archive and wheel
        run: python -m build --no-isolation
      - name: Verify shipped code, licenses, and runtime assets
        run: python -m scripts.check_distribution dist
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/caseproof-wheel-env"
          "$RUNNER_TEMP/caseproof-wheel-env/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/caseproof-wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/caseproof-wheel-env/bin/python" -m pip check
      - name: Exercise installed assets outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/caseproof-wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_distribution.py" --installed

  dependencies:
    name: OSV dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.0
      - name: Audit the complete recorded dependency set with OSV
        run: |
          mkdir -p reports/ci
          python -m pip_audit --strict --disable-pip --require-hashes --vulnerability-service osv -r requirements-dev.lock --format json --output reports/ci/osv.json
          python -m pip_audit --strict --disable-pip --require-hashes --vulnerability-service osv -r requirements-evaluation.lock --format json --output reports/ci/osv-evaluation.json
          python -m pip_audit --strict --disable-pip --require-hashes --vulnerability-service osv -r requirements-postgres.lock --format json --output reports/ci/osv-postgres.json
      - name: Preserve audit result, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-dependency-audit
          path: reports/ci/osv*.json
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Pull request dependency changes
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
